[test-groups]
# These integration tests share the hosted rootless Docker daemon. Keep their
# daemon pressure bounded while unrelated tests run at nextest's normal parallelism.
rootless-docker = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(/(docker_lifecycle::|auto_queue_cannot_start_task_from_unapproved_feature|auto_queue_runs_independent_tasks_past_review_and_during_planning|docker_engine::|resource_bridge::tests::end_to_end::|implementation_harness_without_an_application_session_fails_before_provider_launch)/)'
test-group = 'rootless-docker'
