[package]
name = "koolade"
version = "0.1.0"
edition = "2024"
description = "Conversational project planning with a living specification and implementation workflow."
license = "MIT"

[[bin]]
name = "koolade"
path = "src/main.rs"

[[bin]]
name = "koolade-qa-desktop"
path = "src/bin/koolade_qa_desktop.rs"

[[bin]]
name = "koolade-qa-desktop-fixture"
path = "src/bin/koolade_qa_desktop_fixture.rs"
required-features = ["qa-desktop-driver-image"]

[lib]
name = "koolade"
path = "src/lib.rs"

[features]
qa-desktop-driver-image = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
egui = "0.36.1"
eframe = "0.36.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2.189"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"
pgp = { version = "0.21.0", default-features = false }
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }
uuid = { version = "1.26.0", features = ["v4", "v5"] }
unicode-general-category = "1.1.0"
url = "2.5.8"
bollard = { version = "0.21.1", default-features = false, features = ["pipe", "buildkit_providerless", "chrono"] }
fs2 = "0.4.3"
tempfile = "3.27.0"
futures-util = { version = "0.3.34", default-features = false, features = ["io", "std"] }
tokio = { version = "1.53.2", default-features = false, features = ["fs", "io-util", "net", "rt-multi-thread", "time", "sync", "macros"] }
tar = "0.4.46"
flate2 = "1.1.10"
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
tower-service = "0.3.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["image", "xtest", "res"] }

[profile.release]
lto = "thin"
