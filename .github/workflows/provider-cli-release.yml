name: Promote reviewed provider CLI images
on:
  pull_request:
    paths:
      - containers/provider-cli-release.json
      - .github/workflows/provider-cli-release.yml
  push:
    branches: [main]
    paths:
      - containers/provider-cli-release.json

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.repository == 'zbarno/kool.ade'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/provider-release-evidence
        with:
          architecture: ${{ matrix.architecture }}

  approval:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zbarno/kool.ade'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      statuses: read
    steps:
      - name: Verify release authorization and required quality gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" | jq -er --arg sha "$GITHUB_SHA" '
            [.[] | select(.merge_commit_sha == $sha and .merged_at != null and .base.ref == "main")]
            | select(length == 1) | .[0].number')"
          # GraphQL binds its own $number variable.
          # shellcheck disable=SC2016
          review="$(gh api graphql -F number="$pr" -f query='query($number:Int!) {
            repository(owner:"zbarno", name:"kool.ade") { pullRequest(number:$number) {
              author { login } headRefOid reviewDecision latestOpinionatedReviews(first:100) {
                nodes { author { login } state commit { oid } }
              }
            } }
          }' --jq '.data.repository.pullRequest')"
          previous="$(jq -er .before "$GITHUB_EVENT_PATH")"
          record_hash="$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/containers/provider-cli-release.json?ref=$GITHUB_SHA" | sha256sum | cut -d' ' -f1)"
          # The owner authorized the two manifests in #731 for this single main update.
          if [[ "$previous" == c154c5b71e570484b874d8e4a361c7044625ab9f &&
                "$record_hash" == c27b21418d45198eca1ccec82e80d6146eb1f387d66667f2d5181a4c17d3ff53 &&
                "$GITHUB_ACTOR_ID" == 5166344 ]]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" | jq -e '.merged_by.id == 5166344' >/dev/null
            head="$(jq -er .headRefOid <<< "$review")"
          else
            head="$(jq -er 'select(.reviewDecision == "APPROVED") | . as $pr |
              select(any(.latestOpinionatedReviews.nodes[];
                .state == "APPROVED" and .commit.oid == $pr.headRefOid and .author.login != $pr.author.login))
              | .headRefOid' <<< "$review")"
          fi
          for path in containers/provider-cli-release.json .github/workflows/provider-cli-release.yml; do
            reviewed="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$head" --jq .sha)"
            merged="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_SHA" --jq .sha)"
            test "$reviewed" = "$merged"
          done
          gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup |
            jq -e 'any(.statusCheckRollup[]; .workflowName == "Koolade quality gates" and
              .name == "format, tests, and clippy" and .conclusion == "SUCCESS")'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zbarno/kool.ade'
    needs: [verify, approval]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    strategy:
      matrix:
        architecture: [amd64, arm64]
    env:
      IMAGE: ghcr.io/zbarno/koolade-provider-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: evidence
        uses: ./.github/actions/provider-release-evidence
        with:
          architecture: ${{ matrix.architecture }}
      - name: Publish verified OCI bytes and check the registry digest
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHITECTURE: ${{ matrix.architecture }}
          DIGEST: ${{ steps.evidence.outputs.digest }}
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi
          # The attestation action reads the default Docker auth file directly.
          docker_config="$HOME/.docker"
          printf '%s' "$GH_TOKEN" | docker --config "$docker_config" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          jq -e '.auths["ghcr.io"].auth | type == "string" and length > 0' "$docker_config/config.json" >/dev/null
          tag="$IMAGE:release-$GITHUB_SHA-$ARCHITECTURE"
          skopeo copy --authfile "$docker_config/config.json" --preserve-digests \
            "oci:$RUNNER_TEMP/provider-evidence/oci" "docker://$tag"
          actual="$(skopeo inspect --authfile "$docker_config/config.json" --format '{{.Digest}}' "docker://$tag")"
          test "$actual" = "$DIGEST"
      - name: Attest provider image publication
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.evidence.outputs.digest }}
          push-to-registry: true
      - name: Attest retained provider SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.evidence.outputs.digest }}
          sbom-path: ${{ runner.temp }}/provider-evidence/sbom.spdx.json
          push-to-registry: true
      - name: Clear the publisher registry login
        if: always()
        run: docker --config "$HOME/.docker" logout ghcr.io
