name: Azure Static Web Apps Preview Cleanup

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

permissions:
  contents: none

jobs:
  close_pull_request_job:
    runs-on: ubuntu-latest
    name: Close Pull Request Preview
    steps:
      - name: Close Pull Request Preview
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_WAVE_0B7FD5B0F }}
          action: "close"
