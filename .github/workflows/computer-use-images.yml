name: Computer Use guest image candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "containers/computer-use/**"
      - "src/computer_use/guest_protocol/**"
      - "src/bin/koolade_computer_use_agent.rs"
      - "src/bin/koolade_computer_use_app_helper.rs"
      - "src/computer_use/apps/**"
      - "src/computer_use/mcp/controller/session_journal/**"
      - "src/computer_use/guest_protocol/tests.rs"
      - "tests/fixtures/computer_use/synthetic_idp/**"
      - "docs/computer-use-personal-auth-fixture-v1.md"
      - "src/computer_use.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/computer-use-guest-images-v1.md"
      - ".github/workflows/computer-use-images.yml"

permissions:
  contents: read

jobs:
  synthetic-personal-auth:
    name: Synthetic personal login, MFA, and browser restart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned browser QA runtime
        run: docker build --file containers/runtime-qa/browser/Dockerfile --tag koolade-personal-auth-fixture containers/runtime-qa/browser
      - name: Run synthetic IdP and MFA in an isolated real browser
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests/fixtures/computer_use/synthetic_idp,dst=/opt/koolade-runtime-qa/personal-fixture,readonly" \
            --entrypoint node koolade-personal-auth-fixture \
            --test /opt/koolade-runtime-qa/personal-fixture/browser_restart.test.mjs

  guest-companions:
    name: Build guest companions for Debian Bookworm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and fetch locked dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 fetch --locked
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
      - name: Build companions against the guest's glibc baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/computer-use-guest-target" "$RUNNER_TEMP/computer-use-companions"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume /etc/ssl/certs:/runner-certs:ro \
            --volume "$HOME/.cargo/registry:/cargo/registry:ro" \
            --volume "$HOME/.cargo/git:/cargo/git:ro" \
            --volume "$HOME/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu:/rust:ro" \
            --volume "$RUNNER_TEMP/computer-use-guest-target:/target" \
            --volume "$RUNNER_TEMP/computer-use-companions:/out" \
            --workdir /workspace \
            debian:bookworm@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880 \
            bash -euc '
              printf "%s\\n" \
                "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20261101T000000Z bookworm main" \
                "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20261101T000000Z bookworm-security main" \
                > /tmp/bookworm-snapshot.list
              apt_options=(
                -o Acquire::Check-Valid-Until=false
                -o Acquire::Retries=5
                -o Acquire::https::CaInfo=/runner-certs/ca-certificates.crt
                -o Dir::Etc::sourcelist=/tmp/bookworm-snapshot.list
                -o Dir::Etc::sourceparts=-
              )
              apt-get "${apt_options[@]}" update
              apt-get "${apt_options[@]}" install --yes --no-install-recommends \
                ca-certificates build-essential cmake pkg-config libasound2-dev libfontconfig1-dev \
                libfreetype6-dev libgl1-mesa-dev libwayland-dev libx11-dev \
                libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev
              mkdir -p /tmp/cargo-home
              ln -s /cargo/registry /tmp/cargo-home/registry
              ln -s /cargo/git /tmp/cargo-home/git
              export CARGO_HOME=/tmp/cargo-home CARGO_TARGET_DIR=/target
              export RUSTC=/rust/bin/rustc PATH=/rust/bin:$PATH
              cargo build --locked --offline --release \
                --bin koolade-computer-use-agent --bin koolade_computer_use_app_helper
              for binary in \
                /target/release/koolade-computer-use-agent \
                /target/release/koolade_computer_use_app_helper; do
                if ! ldd -r "$binary" > /tmp/ldd-output 2>&1; then
                  cat /tmp/ldd-output >&2
                  exit 1
                fi
                if grep -E "not found|GLIBC_[0-9.]+.*not found" /tmp/ldd-output; then
                  exit 1
                fi
              done
              install -m 0755 /target/release/koolade-computer-use-agent /out/
              install -m 0755 /target/release/koolade_computer_use_app_helper \
                /out/koolade-computer-use-app-helper
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-use-guest-companions-${{ github.sha }}
          path: ${{ runner.temp }}/computer-use-companions/
          if-no-files-found: error
          retention-days: 14

  candidate:
    needs: guest-companions
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: computer-use-guest-companions-${{ github.sha }}
          path: ${{ runner.temp }}/computer-use-companions
      - name: Install image builder tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes debootstrap debian-archive-keyring qemu-utils \
            grub-pc-bin grub2-common parted e2fsprogs dpkg-dev libasound2-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libwayland-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev
      - name: Verify real qcow2 copy-on-write isolation
        run: bash containers/computer-use/test-overlay-isolation.sh
      - name: Build twice and verify reproducibility
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/computer-use-image-first"
          second="$RUNNER_TEMP/computer-use-image-second"
          agent="$RUNNER_TEMP/computer-use-companions/koolade-computer-use-agent"
          app_helper="$RUNNER_TEMP/computer-use-companions/koolade-computer-use-app-helper"
          chmod 0755 "$agent" "$app_helper"
          containers/computer-use/build-image.sh "$first" "$agent" "$app_helper"
          containers/computer-use/build-image.sh "$second" "$agent" "$app_helper"
          image="koolade-computer-use-guest-x86_64.qcow2"
          verify_image_digest() {
            local directory="$1"
            local actual declared
            actual="$(sha256sum "$directory/$image" | cut -d ' ' -f 1)"
            declared="$(cut -d ' ' -f 1 "$directory/koolade-computer-use-guest-x86_64.sha256")"
            if [[ ! "$declared" =~ ^[[:xdigit:]]{64}$ || "$actual" != "$declared" ]]; then
              echo "candidate qcow2 digest sidecar does not match image in $directory: actual=$actual declared=$declared" >&2
              exit 1
            fi
            printf '%s\n' "$actual"
          }
          first_digest="$(verify_image_digest "$first")"
          second_digest="$(verify_image_digest "$second")"
          if [[ "$first_digest" != "$second_digest" ]]; then
            echo "candidate qcow2 digests differ: first=$first_digest second=$second_digest" >&2
            if ! qemu-img compare -f qcow2 \
              "$first/$image" "$second/$image"; then
              echo "candidate virtual disk contents differ" >&2
              first_raw="$RUNNER_TEMP/computer-use-image-first.raw"
              second_raw="$RUNNER_TEMP/computer-use-image-second.raw"
              qemu-img convert -f qcow2 -O raw -S 4k "$first/$image" "$first_raw"
              qemu-img convert -f qcow2 -O raw -S 4k "$second/$image" "$second_raw"
              disk_offset="$(python3 - "$first_raw" "$second_raw" <<'PY'
          import sys

          first_path, second_path = sys.argv[1:]
          chunk_size = 1024 * 1024
          offset = 0
          with open(first_path, "rb") as first, open(second_path, "rb") as second:
              while first_chunk := first.read(chunk_size):
                  second_chunk = second.read(chunk_size)
                  if first_chunk != second_chunk:
                      for index, (left, right) in enumerate(zip(first_chunk, second_chunk)):
                          if left != right:
                              offset += index
                              print(offset)
                              raise SystemExit(0)
                  offset += len(first_chunk)
          raise SystemExit("virtual images differ but no byte difference was found")
          PY
          )"
              partition_offset=1048576
              if (( disk_offset >= partition_offset )); then
                filesystem_block=$(((disk_offset - partition_offset) / 4096))
                echo "first differing virtual byte: $disk_offset; ext4 block: $filesystem_block" >&2
                diagnostic_loop="$(sudo losetup --find --show --offset "$partition_offset" "$first_raw")"
                block_inodes="$(sudo debugfs -R "icheck $filesystem_block" "$diagnostic_loop" 2>&1 || true)"
                printf '%s\n' "$block_inodes" >&2
                inode_numbers="$(printf '%s\n' "$block_inodes" \
                  | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { print $2 }' \
                  | sort -u)"
                while IFS= read -r inode_number; do
                  [[ -n "$inode_number" ]] || continue
                  sudo debugfs -R "ncheck <$inode_number>" "$diagnostic_loop" || true
                done <<< "$inode_numbers"
                sudo losetup -d "$diagnostic_loop"
              else
                echo "first differing virtual byte: $disk_offset (before root partition)" >&2
              fi
            else
              echo "candidate qcow2 containers differ but virtual disk contents match" >&2
            fi
            exit 1
          fi
          for suffix in \
            packages.tsv app-packages.tsv sbom.cdx.json agent.sha256 app-helper.sha256 qemu-info.json recipe-components.sha256 \
            recipe.sha256 builder-versions.txt source-revision promotion-status.txt; do
            first_file="$first/koolade-computer-use-guest-x86_64.$suffix"
            second_file="$second/koolade-computer-use-guest-x86_64.$suffix"
            if ! cmp -s "$first_file" "$second_file"; then
              echo "candidate sidecar differs: $suffix" >&2
              diff -u "$first_file" "$second_file" || true
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/computer-use-image"
          cp -a "$first/." "$RUNNER_TEMP/computer-use-image/"
          cp "$agent" "$RUNNER_TEMP/computer-use-image/koolade-computer-use-agent"
          cp "$app_helper" "$RUNNER_TEMP/computer-use-image/koolade-computer-use-app-helper"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-use-guest-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/computer-use-image/
          if-no-files-found: error
          retention-days: 14

  attest-main-candidate:
    needs: candidate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: computer-use-guest-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/computer-use-image
      - id: image
        name: Read candidate subject digest
        env:
          IMAGE_RECORD: ${{ runner.temp }}/computer-use-image/koolade-computer-use-guest-x86_64.sha256
        run: echo "digest=sha256:$(cut -d ' ' -f 1 "$IMAGE_RECORD")" >> "$GITHUB_OUTPUT"
      - name: Attest candidate image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: koolade-computer-use-guest-x86_64.qcow2
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: false
          github-token: ${{ github.token }}
      - name: Attest candidate package inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: koolade-computer-use-guest-x86_64.qcow2
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/computer-use-image/koolade-computer-use-guest-x86_64.sbom.cdx.json
          push-to-registry: false
          github-token: ${{ github.token }}
