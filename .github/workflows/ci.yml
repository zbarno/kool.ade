name: Koolade quality gates

on:
  pull_request:
  push:
    branches: [main, master, 'koolade/checks/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-navigation:
    name: documentation navigation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test documentation navigation validator
        run: python3 -m unittest scripts.tests.test_doc_navigation -v
      - name: Test Manager knowledge evaluation corpus and scorer
        run: python3 -m unittest scripts.tests.test_manager_knowledge_evaluation -v
      - name: Test Computer Use documentation status validator
        run: python3 -m unittest scripts.tests.test_computer_use_doc_status -v
      - name: Test Computer Use R1 KVM host preflight
        run: python3 -m unittest scripts.tests.test_computer_use_r1_kvm_host -v
      - name: Test Computer Use R1 KVM runner fail-closed policy
        run: python3 -m unittest scripts.tests.test_computer_use_r1_kvm_runners -v
      - name: Validate documentation navigation indexes
        run: python3 scripts/check-doc-navigation.py
      - name: Validate Computer Use docs against release flags
        run: python3 scripts/check-computer-use-doc-status.py

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check
      - name: Check standalone Windows regression formatting
        run: cargo +1.98.1 fmt --manifest-path tests/windows-process-tree/Cargo.toml -- --check
      - name: Check Computer Use storage fixture formatting
        run: cargo +1.98.1 fmt --manifest-path tests/windows-computer-use-storage/Cargo.toml -- --check

  tests:
    # Do not provision expensive runtimes if the fast Rust checks fail.
    needs: [format, clippy, core-implementation, docs]
    name: tests and Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The runner must hold locked Docker images and two Rust test/binary
    # link artifacts simultaneously. Debug symbols consumed its remaining
    # disk space before tests could start (os error 28).
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install isolated rootless-daemon prerequisites
        run: |
          set -uo pipefail
          # Runner apt mirrors occasionally drop mid-fetch (e.g. a rotated
          # azure.archive.ubuntu.com alias); retry rather than fail the job.
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update && sudo apt-get install --yes uidmap slirp4netns; then
              installed=1
              break
            fi
            echo "::warning::apt attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::could not install uidmap slirp4netns after 6 attempts" >&2
            exit 1
          fi
      - name: Prepare rootless Docker systemd session
        run: bash scripts/prepare-rootless-docker-session.sh
      - name: Start an isolated rootless Docker Engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.9.3
          rootless: true
          set-host: true
      - name: Require rootless Linux container support
        run: |
          set -euo pipefail
          command -v ssh-keygen >/dev/null
          command -v ssh-keyscan >/dev/null
          command -v ssh >/dev/null
          test "$(docker info --format '{{.OSType}}')" = linux
          test "$(docker info --format '{{.ServerVersion}}')" = 29.9.3
          docker info --format '{{json .SecurityOptions}}' \
            | jq -e 'any(.[]; contains("name=rootless"))' >/dev/null
      - name: Install loopback SSH server for authenticated remote E2E
        run: |
          set -uo pipefail
          # Runner apt mirrors occasionally drop mid-fetch (e.g. a rotated
          # azure.archive.ubuntu.com alias); retry rather than fail the job.
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update && sudo apt-get install --yes openssh-server socat; then
              installed=1
              break
            fi
            echo "::warning::apt attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::could not install openssh-server socat after 6 attempts" >&2
            exit 1
          fi
          fixture_password="$(openssl rand -hex 32)"
          printf '%s:%s\n' "$USER" "$fixture_password" | sudo chpasswd
          unset fixture_password
          sudo install -d -o root -g root -m 0755 /run/sshd
          command -v /usr/sbin/sshd
          test -d /run/sshd
      - name: Route rootless Docker through the approved user socket
        run: |
          set -euo pipefail
          case "$DOCKER_HOST" in
            unix:///*) rootless_socket="${DOCKER_HOST#unix://}" ;;
            *) echo "Rootless Docker must use its per-job Unix socket" >&2; exit 1 ;;
          esac
          approved_socket="$XDG_RUNTIME_DIR/docker.sock"
          if [ "$rootless_socket" != "$approved_socket" ]; then
            test ! -e "$approved_socket"
            socat "UNIX-LISTEN:$approved_socket,fork,mode=0600" \
              "UNIX-CONNECT:$rootless_socket" \
              >"$RUNNER_TEMP/docker-socket-proxy.log" 2>&1 &
            proxy_pid=$!
            for attempt in $(seq 1 50); do
              if [ -S "$approved_socket" ]; then break; fi
              if ! kill -0 "$proxy_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/docker-socket-proxy.log" >&2
                exit 1
              fi
              sleep 0.1
            done
            test -S "$approved_socket"
          fi
          docker --host "unix://$approved_socket" info --format '{{.ServerVersion}}' \
            | grep --fixed-strings --line-regexp 29.9.3
      - name: Pre-pull locked Linux test images
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            docker pull --platform linux/amd64 "$image"
          done < <(jq -r '.profiles | to_entries[] | .value[] | select(.platform == "linux/amd64" and .runtime_enabled != false) | .reference' containers/images.lock.json | sort -u)
      - name: Install pinned Node.js and npm for the offline restore E2E
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep each job's compiled artifacts distinct; Clippy's check-only
          # output cannot replace the test and doctest codegen caches.
          shared-key: rust-1.98.1-tests
          cache-workspace-crates: true
      - name: Build the worker executable for loopback SSH integration
        run: time -p cargo +1.98.1 build --locked --bin koolade
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Run general suite then isolate Docker-heavy worker E2Es
        env:
          KOOLADE_TEST_SUITE_LABEL: Parallel general test suite
          KOOLADE_DOCKER_BACKEND_INTEGRATION: "1"
          KOOLADE_TEST_APPROVE_LOCKED_IMAGES: "1"
          KOOLADE_REMOTE_DOCKER_BACKEND_INTEGRATION: "1"
          KOOLADE_REQUIRE_SSHD_E2E: "1"
          KOOLADE_TEST_WORKER_BINARY: target/debug/koolade
          KOOLADE_TEST_DIAGNOSTICS_FILE: ${{ runner.temp }}/remote-worker-retry.log
        run: |
          unset DOCKER_CONTEXT
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          : > "$KOOLADE_TEST_DIAGNOSTICS_FILE"
          tail --follow=name --retry "$KOOLADE_TEST_DIAGNOSTICS_FILE" &
          diagnostics_pid=$!
          trap 'kill "$diagnostics_pid" 2>/dev/null || true; wait "$diagnostics_pid" 2>/dev/null || true' EXIT
          printf '### Parallel general-suite phase\n' >> "$GITHUB_STEP_SUMMARY"
          set +e
          /usr/bin/time -p -o "$RUNNER_TEMP/nextest-time.txt" \
            cargo +1.98.1 nextest run --locked --all-targets --no-fail-fast --test-threads 16 \
              -E 'not (test(/^core::implementation::tests::/) and not test(/docker_lifecycle/)) and not test(/^core::implementation::tests::docker_lifecycle::cancelled_task_clone_resumes_through_docker_verification_and_waits_for_pr_authorization$/) and not test(/^app::root::board_tests::queue_execution::concurrent_workers::auto_queue_runs_independent_tasks_past_review_and_during_planning$/) and not test(/^harness::resource_bridge::tests::end_to_end::remote::/) and not test(/^execution::docker::backend::tests::docker_engine::system_image::approved_polyglot_composite_is_cached_and_isolated_across_tasks$/) and not test(/^execution::docker::backend::tests::docker_engine::stack_recipes::approved_stack_recipes_execute_across_runtime_profiles$/) and not test(/^execution::docker::backend::tests::docker_engine::composite_persistence::planted_derived_tag_squats_recover_non_destructively_and_preserve_foreign_data$/)'
          parallel_status=$?
          set -e

          cat "$RUNNER_TEMP/nextest-time.txt"
          set +e
          python3 scripts/summarize-nextest-junit.py \
            "$RUNNER_TEMP/nextest-time.txt" \
            target/nextest/default/nextest.xml \
            >> "$GITHUB_STEP_SUMMARY"
          parallel_report_status=$?
          set -e
          mkdir -p target/nextest/inventory
          cp target/nextest/default/nextest.xml target/nextest/inventory/parallel-suite.xml
          export KOOLADE_TEST_SUITE_LABEL="Isolated Docker Engine recipe and persistence tests"
          printf '### Isolated Docker Engine recipe and persistence phase\n' >> "$GITHUB_STEP_SUMMARY"
          set +e
          /usr/bin/time -p -o "$RUNNER_TEMP/docker-engine-nextest-time.txt" \
            cargo +1.98.1 nextest run --locked --all-targets --no-fail-fast --test-threads 1 \
              -E 'test(/^execution::docker::backend::tests::docker_engine::system_image::approved_polyglot_composite_is_cached_and_isolated_across_tasks$/) or test(/^execution::docker::backend::tests::docker_engine::stack_recipes::approved_stack_recipes_execute_across_runtime_profiles$/) or test(/^execution::docker::backend::tests::docker_engine::composite_persistence::planted_derived_tag_squats_recover_non_destructively_and_preserve_foreign_data$/)'
          docker_engine_status=$?
          set -e

          cat "$RUNNER_TEMP/docker-engine-nextest-time.txt"
          set +e
          python3 scripts/summarize-nextest-junit.py \
            "$RUNNER_TEMP/docker-engine-nextest-time.txt" \
            target/nextest/default/nextest.xml \
            >> "$GITHUB_STEP_SUMMARY"
          docker_engine_report_status=$?
          set -e
          cp target/nextest/default/nextest.xml target/nextest/inventory/docker-engine-isolated.xml

          export KOOLADE_TEST_SUITE_LABEL="Isolated remote worker integration tests"
          printf '### Isolated remote-worker phase\n' >> "$GITHUB_STEP_SUMMARY"
          set +e
          /usr/bin/time -p -o "$RUNNER_TEMP/isolated-nextest-time.txt" \
            cargo +1.98.1 nextest run --locked --all-targets --no-fail-fast --test-threads 16 \
              -E 'test(/^harness::resource_bridge::tests::end_to_end::remote::/)'
          isolated_status=$?
          set -e

          cat "$RUNNER_TEMP/isolated-nextest-time.txt"
          set +e
          python3 scripts/summarize-nextest-junit.py \
            "$RUNNER_TEMP/isolated-nextest-time.txt" \
            target/nextest/default/nextest.xml \
            >> "$GITHUB_STEP_SUMMARY"
          isolated_report_status=$?
          set -e
          mkdir -p target/nextest/inventory
          cp target/nextest/default/nextest.xml target/nextest/inventory/remote-worker-isolated.xml
          if [ "$parallel_status" -ne 0 ]; then exit "$parallel_status"; fi
          if [ "$parallel_report_status" -ne 0 ]; then exit "$parallel_report_status"; fi
          if [ "$docker_engine_status" -ne 0 ]; then exit "$docker_engine_status"; fi
          if [ "$docker_engine_report_status" -ne 0 ]; then exit "$docker_engine_report_status"; fi
          if [ "$isolated_status" -ne 0 ]; then exit "$isolated_status"; fi
          exit "$isolated_report_status"

      - name: Record storage and rootless Docker health after test shard
        if: always()
        run: |
          df -h / "$RUNNER_TEMP" || true
          du -sh target/debug "$HOME/.cargo" 2>/dev/null || true
          timeout 15s docker info --format '{{.ServerVersion}} {{json .SecurityOptions}}' || true
          timeout 15s docker system df || true

      - name: Report remote worker retry stages
        if: always()
        env:
          KOOLADE_TEST_DIAGNOSTICS_FILE: ${{ runner.temp }}/remote-worker-retry.log
        run: |
          if [ -f "$KOOLADE_TEST_DIAGNOSTICS_FILE" ]; then
            cat "$KOOLADE_TEST_DIAGNOSTICS_FILE"
          fi

      - name: Retain per-test timing inventory
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/inventory/*.xml
          if-no-files-found: error
          retention-days: 14

  core-implementation:
    needs: format
    name: Git and implementation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-1.98.1-implementation-tests
          cache-workspace-crates: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Run isolated Git and reconciliation tests
        env:
          KOOLADE_TEST_SUITE_LABEL: Git/reconciliation shard
        run: |
          /usr/bin/time -p -o "$RUNNER_TEMP/nextest-time.txt" \
            cargo +1.98.1 nextest run --locked --all-targets --no-fail-fast --test-threads 16 \
              -E 'test(/^core::implementation::tests::/) and not test(/docker_lifecycle/)'
          cat "$RUNNER_TEMP/nextest-time.txt"
          python3 scripts/summarize-nextest-junit.py \
            "$RUNNER_TEMP/nextest-time.txt" target/nextest/default/nextest.xml \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Retain Git/reconciliation timing inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-implementation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/default/nextest.xml
          if-no-files-found: warn
          retention-days: 14
  daemon-recovery:
    # Do not provision expensive runtimes if the fast Rust checks fail.
    needs: [format, clippy, core-implementation, docs]
    name: isolated Docker daemon recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install isolated rootless-daemon prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes uidmap slirp4netns socat
      - name: Prepare rootless Docker systemd session
        run: bash scripts/prepare-rootless-docker-session.sh
      - name: Start an isolated rootless Docker Engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.9.3
          rootless: true
          set-host: true
      - name: Require rootless Linux container support
        run: |
          test "$(docker info --format '{{.OSType}}')" = linux
          docker info --format '{{json .SecurityOptions}}' \
            | jq -e 'any(.[]; contains("name=rootless"))' >/dev/null
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-1.98.1-daemon-recovery
          cache-workspace-crates: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Verify isolated rootless-daemon restart prerequisites
        run: |
          set -euo pipefail
          command -v dockerd-rootless.sh
          command -v rootlesskit
          command -v newuidmap
          command -v newgidmap
          grep --extended-regexp --quiet "^$USER:[0-9]+:65536$" /etc/subuid
          grep --extended-regexp --quiet "^$USER:[0-9]+:65536$" /etc/subgid

      - name: Run isolated Docker daemon restart recovery E2E
        env:
          KOOLADE_DOCKER_DAEMON_RESTART_INTEGRATION: "1"
          KOOLADE_TEST_APPROVE_LOCKED_IMAGES: "1"
        run: |
          unset DOCKER_CONTEXT
          cargo +1.98.1 nextest run --locked --lib --no-fail-fast --test-threads 1 \
            -E 'test(restarted_rootless_daemon_preserves_dirty_clone_without_command_replay)'

      - name: Pre-pull locked General image for task resume E2E
        run: |
          set -euo pipefail
          unset DOCKER_CONTEXT
          mapfile -t images < <(jq -r '.profiles.general[] | select(.platform == "linux/amd64" and .runtime_enabled != false) | .reference' containers/images.lock.json | sort -u)
          test "${#images[@]}" -gt 0
          for image in "${images[@]}"; do
            docker pull --platform linux/amd64 "$image"
          done

      - name: Run isolated Docker-backed task resume E2E
        env:
          KOOLADE_DOCKER_BACKEND_INTEGRATION: "1"
          KOOLADE_TEST_APPROVE_LOCKED_IMAGES: "1"
        run: |
          set -euo pipefail
          unset DOCKER_CONTEXT
          case "$DOCKER_HOST" in
            unix:///*) rootless_socket="${DOCKER_HOST#unix://}" ;;
            *) echo "Rootless Docker must use its per-job Unix socket" >&2; exit 1 ;;
          esac
          approved_socket="$XDG_RUNTIME_DIR/docker.sock"
          if [ "$rootless_socket" != "$approved_socket" ]; then
            test ! -e "$approved_socket"
            socat "UNIX-LISTEN:$approved_socket,fork,mode=0600" \
              "UNIX-CONNECT:$rootless_socket" \
              >"$RUNNER_TEMP/docker-socket-proxy.log" 2>&1 &
            proxy_pid=$!
            trap 'kill "$proxy_pid" 2>/dev/null || true; wait "$proxy_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 50); do
              if [ -S "$approved_socket" ]; then break; fi
              if ! kill -0 "$proxy_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/docker-socket-proxy.log" >&2
                exit 1
              fi
              sleep 0.1
            done
            test -S "$approved_socket"
          fi
          export DOCKER_HOST="unix://$approved_socket"
          docker info --format '{{.ServerVersion}}' | grep --fixed-strings --line-regexp 29.9.3
          cargo +1.98.1 nextest run --locked --lib --no-fail-fast --test-threads 1 \
            -E 'test(cancelled_task_clone_resumes_through_docker_verification_and_waits_for_pr_authorization)'
  queue-concurrency:
    # Do not provision expensive runtimes if the fast Rust checks fail.
    needs: [format, clippy, core-implementation, docs]
    name: isolated queue concurrency E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Like the Docker test shard, this job holds pinned images plus both the
    # app worker and the test binary in its single rootless runner.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install isolated rootless-daemon prerequisites
        run: |
          set -uo pipefail
          # Runner apt mirrors occasionally drop mid-fetch (e.g. a rotated
          # azure.archive.ubuntu.com alias); retry rather than fail the job.
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update && sudo apt-get install --yes uidmap slirp4netns; then
              installed=1
              break
            fi
            echo "::warning::apt attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::could not install uidmap slirp4netns after 6 attempts" >&2
            exit 1
          fi
      - name: Prepare rootless Docker systemd session
        run: bash scripts/prepare-rootless-docker-session.sh
      - name: Start an isolated rootless Docker Engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.9.3
          rootless: true
          set-host: true
      - name: Require rootless container support
        run: |
          set -euo pipefail
          test "$(docker info --format '{{.OSType}}')" = linux
          test "$(docker info --format '{{.ServerVersion}}')" = 29.9.3
          docker info --format '{{json .SecurityOptions}}' \
            | jq -e 'any(.[]; contains("name=rootless"))' >/dev/null
      - name: Install socket proxy dependency
        run: |
          set -uo pipefail
          # Runner apt mirrors occasionally drop mid-fetch (e.g. a rotated
          # azure.archive.ubuntu.com alias); retry rather than fail the job.
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get install --yes socat; then
              installed=1
              break
            fi
            echo "::warning::apt attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::could not install socat after 6 attempts" >&2
            exit 1
          fi

      - name: Route rootless Docker through the approved user socket
        run: |
          set -euo pipefail
          case "$DOCKER_HOST" in
            unix:///*) rootless_socket="${DOCKER_HOST#unix://}" ;;
            *) echo "Rootless Docker must use its per-job Unix socket" >&2; exit 1 ;;
          esac
          approved_socket="$XDG_RUNTIME_DIR/docker.sock"
          if [ "$rootless_socket" != "$approved_socket" ]; then
            test ! -e "$approved_socket"
            socat "UNIX-LISTEN:$approved_socket,fork,mode=0600" \
              "UNIX-CONNECT:$rootless_socket" \
              >"$RUNNER_TEMP/docker-socket-proxy.log" 2>&1 &
            proxy_pid=$!
            for attempt in $(seq 1 50); do
              if [ -S "$approved_socket" ]; then break; fi
              if ! kill -0 "$proxy_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/docker-socket-proxy.log" >&2
                exit 1
              fi
              sleep 0.1
            done
            test -S "$approved_socket"
          fi
          docker --host "unix://$approved_socket" info --format '{{.ServerVersion}}' \
            | grep --fixed-strings --line-regexp 29.9.3
      - name: Pre-pull locked Linux test images
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            docker pull --platform linux/amd64 "$image"
          done < <(jq -r '.profiles | to_entries[] | .value[] | select(.platform == "linux/amd64" and .runtime_enabled != false) | .reference' containers/images.lock.json | sort -u)
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-1.98.1-queue-concurrency
          cache-workspace-crates: true
      - name: Build the worker executable for UI queue integration
        run: time -p cargo +1.98.1 build --locked --bin koolade
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Exercise independent workers, planning overlap, and approval gates
        env:
          KOOLADE_DOCKER_BACKEND_INTEGRATION: "1"
          KOOLADE_TEST_APPROVE_LOCKED_IMAGES: "1"
          KOOLADE_TEST_WORKER_BINARY: target/debug/koolade
          KOOLADE_TEST_SUITE_LABEL: Isolated queue concurrency E2E
        run: |
          unset DOCKER_CONTEXT
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          /usr/bin/time -p -o "$RUNNER_TEMP/nextest-time.txt" \
            cargo +1.98.1 nextest run --locked --lib --no-fail-fast --test-threads 1 \
              -E 'test(/^app::root::board_tests::queue_execution::concurrent_workers::auto_queue_runs_independent_tasks_past_review_and_during_planning$/)'
          cat "$RUNNER_TEMP/nextest-time.txt"
          python3 scripts/summarize-nextest-junit.py \
            "$RUNNER_TEMP/nextest-time.txt" target/nextest/default/nextest.xml \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Report rootless Docker and proxy health after queue test
        if: always()
        run: |
          df -h / "$RUNNER_TEMP" || true
          du -sh target/debug 2>/dev/null || true
          timeout 15s docker info --format '{{.ServerVersion}} {{json .SecurityOptions}}' || true
          timeout 15s docker --host "unix://$XDG_RUNTIME_DIR/docker.sock" info --format '{{.ServerVersion}} {{json .SecurityOptions}}' || true
          if [ -f "$RUNNER_TEMP/docker-socket-proxy.log" ]; then
            tail -n 60 "$RUNNER_TEMP/docker-socket-proxy.log"
          fi

      - name: Retain queue E2E timing and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-queue-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/default/nextest.xml
          if-no-files-found: warn
          retention-days: 14
  docs:
    needs: format
    name: documentation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep each job's compiled artifacts distinct; Clippy's check-only
          # output cannot replace the test and doctest codegen caches.
          shared-key: rust-1.98.1-docs
          cache-workspace-crates: true
      - name: Run documentation tests
        run: time -p cargo +1.98.1 test --locked --doc

  clippy:
    needs: format
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep each job's compiled artifacts distinct; Clippy's check-only
          # output cannot replace the test and doctest codegen caches.
          shared-key: rust-1.98.1-clippy
          cache-workspace-crates: true
      - name: Reject all clippy warnings
        run: time -p cargo +1.98.1 clippy --locked --all-targets -- -D warnings

  windows-process-tree:
    # Do not provision expensive runtimes if the fast Rust checks fail.
    needs: [format, clippy, core-implementation, docs]
    name: Windows discovery process tree
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Verify discovery descendants are terminated
        run: >-
          cargo +1.98.1 test --locked
          --manifest-path tests/windows-process-tree/Cargo.toml
          windows::tests::windows_process_tree_terminates_descendants_when_owner_exits
          -- --exact --nocapture
      - name: Verify provider PATH is restricted to Windows system directories
        run: >-
          cargo +1.98.1 test --locked
          --manifest-path tests/windows-process-tree/Cargo.toml
          launch_environment::tests::windows_provider_path_keeps_only_system_root_and_system32
          -- --exact --nocapture
      - name: Verify Copilot machine policy hook discovery
        run: >-
          cargo +1.98.1 test --locked
          --manifest-path tests/windows-copilot-policy-hooks/Cargo.toml
  windows-computer-use-storage:
    # Run the native storage boundary fixtures on Windows; Unix hosts cannot
    # exercise AF_UNIX reparse tags, Windows owner/DACL inheritance, or QEMU's
    # native AF_UNIX client behavior.
    needs: [format, clippy, core-implementation, docs]
    name: Windows Computer Use storage and QEMU transport
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MSYS2 and its signed QEMU package
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-qemu
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Verify installed QEMU and expose its absolute path
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $qemu = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin\qemu-system-x86_64.exe'
          if (-not (Test-Path -LiteralPath $qemu -PathType Leaf)) {
            throw "Signed MSYS2 package did not install QEMU at $qemu"
          }
          & $qemu --version
          if ($LASTEXITCODE -ne 0) { throw 'QEMU version probe failed' }
          "KOOLADE_TEST_WINDOWS_QEMU=$qemu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify AF_UNIX storage leaf validation
        run: >-
          cargo +1.98.1 test --locked
          computer_use::windows_backend::storage::tests::af_unix_tests
          --manifest-path tests/windows-computer-use-storage/Cargo.toml
          -- --nocapture
      - name: Verify protected short-path listener integration
        run: >-
          cargo +1.98.1 test --locked
          computer_use::windows_backend::storage::tests::guest_control_listener_uses_the_short_private_storage_path
          --manifest-path tests/windows-computer-use-storage/Cargo.toml
          -- --nocapture
      - name: Verify Windows AF_UNIX peer PID identification
        run: >-
          cargo +1.98.1 test --locked
          computer_use::windows_backend::transport::af_unix::tests::peer_pid_ioctl_matches_the_connected_windows_af_unix_client
          --manifest-path tests/windows-computer-use-storage/Cargo.toml
          -- --nocapture
      - name: Verify contained child connects to the app-owned AF_UNIX listener
        run: >-
          cargo +1.98.1 test --locked
          computer_use::windows_backend::storage::tests::contained_af_unix_tests::contained_guest_client_connects_under_job
          --manifest-path tests/windows-computer-use-storage/Cargo.toml
          -- --exact --nocapture
      - name: Verify contained QEMU connects through native AF_UNIX client mode
        run: >-
          cargo +1.98.1 test --locked
          computer_use::windows_backend::storage::tests::contained_af_unix_tests::qemu_af_unix_client_connects_from_inside_a_job
          --manifest-path tests/windows-computer-use-storage/Cargo.toml
          -- --exact --nocapture
  # Supersedes the Fedora 44 Pi host-runtime smoke test: runtime availability
  # now comes from the pinned executor image, exercised by rootless Docker E2E.
  docker-only-check:
    name: Docker-only runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker-only execution policy
        run: bash scripts/assert-docker-only.sh

  quality:
    name: format, tests, and clippy
    if: always()
    needs: [format, tests, core-implementation, daemon-recovery, queue-concurrency, docs, clippy, windows-process-tree, windows-computer-use-storage, docker-only-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CORE_RESULT: ${{ needs['core-implementation'].result }}
          DAEMON_RESULT: ${{ needs['daemon-recovery'].result }}
          QUEUE_RESULT: ${{ needs['queue-concurrency'].result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          WINDOWS_PROCESS_TREE_RESULT: ${{ needs['windows-process-tree'].result }}
          WINDOWS_COMPUTER_USE_STORAGE_RESULT: ${{ needs['windows-computer-use-storage'].result }}
          DOCKER_ONLY_RESULT: ${{ needs.docker-only-check.result }}
        run: |
          printf 'format: %s\ntests: %s\nclippy: %s\n' \
            "$FORMAT_RESULT" "$TESTS_RESULT" "$CLIPPY_RESULT"
          printf 'Git/reconciliation shard: %s\n' "$CORE_RESULT"
          printf 'isolated daemon recovery: %s\n' "$DAEMON_RESULT"
          printf 'isolated queue concurrency: %s\n' "$QUEUE_RESULT"
          printf 'documentation tests: %s\n' "$DOCS_RESULT"
          printf 'Windows process-tree regression: %s\n' "$WINDOWS_PROCESS_TREE_RESULT"
          printf 'Windows Computer Use storage: %s\n' "$WINDOWS_COMPUTER_USE_STORAGE_RESULT"
          printf 'Docker-only runtime: %s\n' "$DOCKER_ONLY_RESULT"
          test "$FORMAT_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$CORE_RESULT" = success
          test "$DAEMON_RESULT" = success
          test "$QUEUE_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$CLIPPY_RESULT" = success
          test "$WINDOWS_PROCESS_TREE_RESULT" = success
          test "$WINDOWS_COMPUTER_USE_STORAGE_RESULT" = success
          test "$DOCKER_ONLY_RESULT" = success
