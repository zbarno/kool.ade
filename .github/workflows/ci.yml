name: Koolade quality gates

on:
  pull_request:
  push:
    branches: [main, master, 'koolade/checks/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check
      - name: Check standalone Windows regression formatting
        run: cargo +1.98.1 fmt --manifest-path tests/windows-process-tree/Cargo.toml -- --check

  tests:
    name: tests and Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install isolated rootless-daemon prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes uidmap slirp4netns
      - name: Prepare rootless Docker systemd session
        run: bash scripts/prepare-rootless-docker-session.sh
      - name: Start an isolated rootless Docker Engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.9.0
          rootless: true
          set-host: true
      - name: Require rootless Linux container support
        run: |
          set -euo pipefail
          command -v ssh-keygen >/dev/null
          command -v ssh-keyscan >/dev/null
          command -v ssh >/dev/null
          test "$(docker info --format '{{.OSType}}')" = linux
          test "$(docker info --format '{{.ServerVersion}}')" = 29.9.0
          docker info --format '{{json .SecurityOptions}}' \
            | jq -e 'any(.[]; contains("name=rootless"))' >/dev/null
      - name: Install loopback SSH server for authenticated remote E2E
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server socat
          fixture_password="$(openssl rand -hex 32)"
          printf '%s:%s\n' "$USER" "$fixture_password" | sudo chpasswd
          unset fixture_password
          sudo install -d -o root -g root -m 0755 /run/sshd
          command -v /usr/sbin/sshd
          test -d /run/sshd
      - name: Route rootless Docker through the approved user socket
        run: |
          set -euo pipefail
          case "$DOCKER_HOST" in
            unix:///*) rootless_socket="${DOCKER_HOST#unix://}" ;;
            *) echo "Rootless Docker must use its per-job Unix socket" >&2; exit 1 ;;
          esac
          approved_socket="$XDG_RUNTIME_DIR/docker.sock"
          if [ "$rootless_socket" != "$approved_socket" ]; then
            test ! -e "$approved_socket"
            socat "UNIX-LISTEN:$approved_socket,fork,mode=0600" \
              "UNIX-CONNECT:$rootless_socket" \
              >"$RUNNER_TEMP/docker-socket-proxy.log" 2>&1 &
            proxy_pid=$!
            for attempt in $(seq 1 50); do
              if [ -S "$approved_socket" ]; then break; fi
              if ! kill -0 "$proxy_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/docker-socket-proxy.log" >&2
                exit 1
              fi
              sleep 0.1
            done
            test -S "$approved_socket"
          fi
          docker --host "unix://$approved_socket" info --format '{{.ServerVersion}}' \
            | grep --fixed-strings --line-regexp 29.9.0
      - name: Pre-pull locked Linux test images
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            docker pull --platform linux/amd64 "$image"
          done < <(jq -r '.profiles | to_entries[] | .value[] | select(.platform == "linux/amd64" and .runtime_enabled != false) | .reference' containers/images.lock.json | sort -u)
      - name: Install pinned Node.js and npm for the offline restore E2E
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep each job's compiled artifacts distinct; Clippy's check-only
          # output cannot replace the test and doctest codegen caches.
          shared-key: rust-1.98.1-tests
          cache-workspace-crates: true
      - name: Build the worker executable for loopback SSH integration
        run: time -p cargo +1.98.1 build --locked --bin koolade
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Run all tests in parallel and report timing
        env:
          KOOLADE_DOCKER_BACKEND_INTEGRATION: "1"
          KOOLADE_REMOTE_DOCKER_BACKEND_INTEGRATION: "1"
          KOOLADE_REQUIRE_SSHD_E2E: "1"
          KOOLADE_TEST_WORKER_BINARY: target/debug/koolade
          KOOLADE_TEST_DIAGNOSTICS_FILE: ${{ runner.temp }}/remote-worker-retry.log
        run: |
          unset DOCKER_CONTEXT
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          : > "$KOOLADE_TEST_DIAGNOSTICS_FILE"
          tail --follow=name --retry "$KOOLADE_TEST_DIAGNOSTICS_FILE" &
          diagnostics_pid=$!
          trap 'kill "$diagnostics_pid" 2>/dev/null || true; wait "$diagnostics_pid" 2>/dev/null || true' EXIT
          set +e
          /usr/bin/time -p -o "$RUNNER_TEMP/nextest-time.txt" \
            cargo +1.98.1 nextest run --locked --all-targets --no-fail-fast --test-threads 16
          test_status=$?
          set -e

          cat "$RUNNER_TEMP/nextest-time.txt"
          set +e
          python3 scripts/summarize-nextest-junit.py \
            "$RUNNER_TEMP/nextest-time.txt" \
            target/nextest/default/nextest.xml \
            >> "$GITHUB_STEP_SUMMARY"
          report_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          exit "$report_status"

      - name: Report remote worker retry stages
        if: always()
        env:
          KOOLADE_TEST_DIAGNOSTICS_FILE: ${{ runner.temp }}/remote-worker-retry.log
        run: |
          if [ -f "$KOOLADE_TEST_DIAGNOSTICS_FILE" ]; then
            cat "$KOOLADE_TEST_DIAGNOSTICS_FILE"
          fi

      - name: Verify isolated rootless-daemon restart prerequisites
        run: |
          set -euo pipefail
          command -v dockerd-rootless.sh
          command -v rootlesskit
          command -v newuidmap
          command -v newgidmap
          grep --extended-regexp --quiet "^$USER:[0-9]+:65536$" /etc/subuid
          grep --extended-regexp --quiet "^$USER:[0-9]+:65536$" /etc/subgid

      - name: Run isolated Docker daemon restart recovery E2E
        env:
          KOOLADE_DOCKER_DAEMON_RESTART_INTEGRATION: "1"
        run: |
          unset DOCKER_CONTEXT
          cargo +1.98.1 nextest run --locked --lib --no-fail-fast --test-threads 1 \
            -E 'test(restarted_rootless_daemon_preserves_dirty_clone_without_command_replay)'

      - name: Retain per-test timing inventory
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/default/nextest.xml
          if-no-files-found: error
          retention-days: 14

  docs:
    name: documentation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep each job's compiled artifacts distinct; Clippy's check-only
          # output cannot replace the test and doctest codegen caches.
          shared-key: rust-1.98.1-docs
          cache-workspace-crates: true
      - name: Run documentation tests
        run: time -p cargo +1.98.1 test --locked --doc

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep each job's compiled artifacts distinct; Clippy's check-only
          # output cannot replace the test and doctest codegen caches.
          shared-key: rust-1.98.1-clippy
          cache-workspace-crates: true
      - name: Reject all clippy warnings
        run: time -p cargo +1.98.1 clippy --locked --all-targets -- -D warnings

  windows-process-tree:
    name: Windows discovery process tree
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Verify discovery descendants are terminated
        run: >-
          cargo +1.98.1 test --locked
          --manifest-path tests/windows-process-tree/Cargo.toml
          windows::tests::windows_process_tree_terminates_descendants_when_owner_exits
          -- --exact --nocapture
      - name: Verify provider PATH is restricted to Windows system directories
        run: >-
          cargo +1.98.1 test --locked
          --manifest-path tests/windows-process-tree/Cargo.toml
          launch_environment::tests::windows_provider_path_keeps_only_system_root_and_system32
          -- --exact --nocapture

  # Supersedes the Fedora 44 Pi host-runtime smoke test: runtime availability
  # now comes from the pinned executor image, exercised by rootless Docker E2E.
  docker-only-check:
    name: Docker-only runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker-only execution policy
        run: bash scripts/assert-docker-only.sh

  quality:
    name: format, tests, and clippy
    if: always()
    needs: [format, tests, docs, clippy, windows-process-tree, docker-only-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          WINDOWS_PROCESS_TREE_RESULT: ${{ needs['windows-process-tree'].result }}
          DOCKER_ONLY_RESULT: ${{ needs.docker-only-check.result }}
        run: |
          printf 'format: %s\ntests: %s\nclippy: %s\n' \
            "$FORMAT_RESULT" "$TESTS_RESULT" "$CLIPPY_RESULT"
          printf 'documentation tests: %s\n' "$DOCS_RESULT"
          printf 'Windows process-tree regression: %s\n' "$WINDOWS_PROCESS_TREE_RESULT"
          printf 'Docker-only runtime: %s\n' "$DOCKER_ONLY_RESULT"
          test "$FORMAT_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$CLIPPY_RESULT" = success
          test "$WINDOWS_PROCESS_TREE_RESULT" = success
          test "$DOCKER_ONLY_RESULT" = success
