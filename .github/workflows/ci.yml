name: Koolade quality gates

on:
  pull_request:
  push:
    branches: [main, master, 'koolade/checks/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, tests, and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node.js and npm for the offline restore E2E
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Enable Bubblewrap namespaces on the disposable runner
        run: |
          # GitHub-hosted Ubuntu VMs are discarded after the job. Ubuntu's
          # AppArmor user-namespace restriction otherwise prevents bwrap from
          # bringing up loopback inside the isolated network namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --die-with-parent --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts --ro-bind / / -- /bin/true
      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check
      - name: Run all tests
        run: cargo +1.98.1 test --locked --all-targets -- --test-threads=1
      - name: Verify sandbox runtime layout on Fedora 44
        run: |
          test_binary="$(cargo +1.98.1 test --locked --lib --no-run --message-format=json | python3 -c '
          import json
          import sys

          executables = []
          for line in sys.stdin:
              try:
                  artifact = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = artifact.get("target", {})
              profile = artifact.get("profile", {})
              if (
                  artifact.get("reason") == "compiler-artifact"
                  and target.get("name") == "koolade"
                  and "lib" in target.get("kind", [])
                  and profile.get("test")
                  and artifact.get("executable")
              ):
                  executables.append(artifact["executable"])
          if len(executables) != 1:
              raise SystemExit(f"expected one koolade library test executable, got {executables!r}")
          print(executables[0])
          ')"
          test_output="$(docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            fedora:44 \
            "$test_binary" \
            harness::pi_sandbox::mounts::system_runtime --test-threads=1)"
          printf '%s\n' "$test_output"
          printf '%s\n' "$test_output" | grep -Eq '^test result: ok\. [1-9][0-9]* passed;'
      - name: Reject all clippy warnings
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
