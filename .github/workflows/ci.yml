name: Packet quality gates

on:
  pull_request:
  push:
    branches: [main, master, 'packet/checks/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, tests, and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check
      - name: Run all tests
        run: cargo +1.98.1 test --locked --all-targets -- --test-threads=1
      - name: Reject all clippy warnings
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings

  desktop-build:
    name: desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Check desktop binary
        run: cargo +1.98.1 check --locked --bin packet
