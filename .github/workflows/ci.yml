name: Koolade quality gates

on:
  pull_request:
  push:
    branches: [main, master, 'koolade/checks/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check

  tests:
    name: tests and Docker runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare rootless Docker systemd session
        run: bash scripts/prepare-rootless-docker-session.sh
      - name: Start an isolated rootless Docker Engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.9.0
          rootless: true
          set-host: true
      - name: Require rootless Linux container support
        run: |
          set -euo pipefail
          command -v ssh-keygen >/dev/null
          command -v ssh-keyscan >/dev/null
          command -v ssh >/dev/null
          test "$(docker info --format '{{.OSType}}')" = linux
          test "$(docker info --format '{{.ServerVersion}}')" = 29.9.0
          docker info --format '{{json .SecurityOptions}}' \
            | jq -e 'any(.[]; contains("name=rootless"))' >/dev/null
      - name: Install loopback SSH server for authenticated remote E2E
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server socat
          sudo install -d -o root -g root -m 0755 /run/sshd
          command -v /usr/sbin/sshd
          test -d /run/sshd
      - name: Route rootless Docker through the approved user socket
        run: |
          set -euo pipefail
          case "$DOCKER_HOST" in
            unix:///*) rootless_socket="${DOCKER_HOST#unix://}" ;;
            *) echo "Rootless Docker must use its per-job Unix socket" >&2; exit 1 ;;
          esac
          approved_socket="$XDG_RUNTIME_DIR/docker.sock"
          if [ "$rootless_socket" != "$approved_socket" ]; then
            test ! -e "$approved_socket"
            socat "UNIX-LISTEN:$approved_socket,fork,mode=0600" \
              "UNIX-CONNECT:$rootless_socket" \
              >"$RUNNER_TEMP/docker-socket-proxy.log" 2>&1 &
            proxy_pid=$!
            for attempt in $(seq 1 50); do
              if [ -S "$approved_socket" ]; then break; fi
              if ! kill -0 "$proxy_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/docker-socket-proxy.log" >&2
                exit 1
              fi
              sleep 0.1
            done
            test -S "$approved_socket"
          fi
          docker --host "unix://$approved_socket" info --format '{{.ServerVersion}}' \
            | grep --fixed-strings --line-regexp 29.9.0
      - name: Pre-pull locked Linux test images
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            docker pull --platform linux/amd64 "$image"
          done < <(jq -r '.profiles | to_entries[] | .value[] | select(.platform == "linux/amd64") | .reference' containers/images.lock.json | sort -u)
      - name: Install pinned Node.js and npm for the offline restore E2E
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-1.98.1
          cache-workspace-crates: true
      - name: Build the worker executable for loopback SSH integration
        run: time -p cargo +1.98.1 build --locked --bin koolade
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Run all tests in parallel and report timing
        env:
          KOOLADE_DOCKER_BACKEND_INTEGRATION: "1"
          KOOLADE_REMOTE_DOCKER_BACKEND_INTEGRATION: "1"
          KOOLADE_REQUIRE_SSHD_E2E: "1"
          KOOLADE_TEST_WORKER_BINARY: target/debug/koolade
        run: |
          unset DOCKER_CONTEXT
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          set +e
          /usr/bin/time -p -o "$RUNNER_TEMP/nextest-time.txt" \
            cargo +1.98.1 nextest run --locked --all-targets --no-fail-fast
          test_status=$?
          set -e

          cat "$RUNNER_TEMP/nextest-time.txt"
          parallel_seconds="$(awk '$1 == "real" { print $2 }' "$RUNNER_TEMP/nextest-time.txt")"
          python3 - "$parallel_seconds" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys

          baseline_seconds = 1732.0
          parallel_seconds = float(sys.argv[1])
          saved_percent = 100 * (baseline_seconds - parallel_seconds) / baseline_seconds
          speedup = baseline_seconds / parallel_seconds
          print("## Rust test suite timing")
          print()
          print("| Run | Wall time |")
          print("| --- | ---: |")
          print(f"| Recorded serial baseline | {baseline_seconds:.1f}s |")
          print(f"| Parallel nextest suite | {parallel_seconds:.1f}s |")
          print()
          print(f"Parallel run: {speedup:.2f}x speedup ({saved_percent:.1f}% less wall time).")
          print("Measured with `/usr/bin/time -p`; both values cover the all-target test command.")
          print("The serial baseline is from an earlier revision (1,441 tests); the current suite may contain additional tests, so this is an indicative cross-revision comparison.")
          PY
          exit "$test_status"

  docs:
    name: documentation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-1.98.1
          cache-workspace-crates: true
      - name: Run documentation tests
        run: time -p cargo +1.98.1 test --locked --doc

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-1.98.1
          cache-workspace-crates: true
      - name: Reject all clippy warnings
        run: time -p cargo +1.98.1 clippy --locked --all-targets -- -D warnings

  # Supersedes the Fedora 44 Pi host-runtime smoke test: runtime availability
  # now comes from the pinned executor image, exercised by rootless Docker E2E.
  docker-only-check:
    name: Docker-only runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker-only execution policy
        run: bash scripts/assert-docker-only.sh

  quality:
    name: format, tests, and clippy
    if: always()
    needs: [format, tests, docs, clippy, docker-only-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          DOCKER_ONLY_RESULT: ${{ needs.docker-only-check.result }}
        run: |
          printf 'format: %s\ntests: %s\nclippy: %s\n' \
            "$FORMAT_RESULT" "$TESTS_RESULT" "$CLIPPY_RESULT"
          printf 'documentation tests: %s\n' "$DOCS_RESULT"
          printf 'Docker-only runtime: %s\n' "$DOCKER_ONLY_RESULT"
          test "$FORMAT_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$CLIPPY_RESULT" = success
          test "$DOCKER_ONLY_RESULT" = success
