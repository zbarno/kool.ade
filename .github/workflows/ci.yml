name: Koolade quality gates

on:
  pull_request:
  push:
    branches: [main, master, 'koolade/checks/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check

  tests:
    name: tests and sandbox runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node.js and npm for the offline restore E2E
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-1.98.1-tests
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest@0.9.148
      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Enable Bubblewrap namespaces on the disposable runner
        run: |
          # GitHub-hosted Ubuntu VMs are discarded after the job. Ubuntu's
          # AppArmor user-namespace restriction otherwise prevents bwrap from
          # bringing up loopback inside the isolated network namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --die-with-parent --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts --ro-bind / / -- /bin/true
      - name: Run all tests in parallel
        run: cargo +1.98.1 nextest run --locked --all-targets --no-fail-fast
      - name: Run documentation tests
        run: cargo +1.98.1 test --locked --doc
      - name: Verify sandbox runtime layout on Fedora 44
        run: |
          test_binary="$(cargo +1.98.1 test --locked --lib --no-run --message-format=json | python3 -c '
          import json
          import sys

          executables = []
          for line in sys.stdin:
              try:
                  artifact = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = artifact.get("target", {})
              profile = artifact.get("profile", {})
              if (
                  artifact.get("reason") == "compiler-artifact"
                  and target.get("name") == "koolade"
                  and "lib" in target.get("kind", [])
                  and profile.get("test")
                  and artifact.get("executable")
              ):
                  executables.append(artifact["executable"])
          if len(executables) != 1:
              raise SystemExit(f"expected one koolade library test executable, got {executables!r}")
          print(executables[0])
          ')"
          test_output="$(docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            fedora:44 \
            "$test_binary" \
            harness::pi_sandbox::mounts::system_runtime)"
          printf '%s\n' "$test_output"
          printf '%s\n' "$test_output" | grep -Eq '^test result: ok\. [1-9][0-9]* passed;'

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-1.98.1-clippy
      - name: Reject all clippy warnings
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings

  quality:
    name: format, tests, and clippy
    if: always()
    needs: [format, tests, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
        run: |
          printf 'format: %s\ntests: %s\nclippy: %s\n' \
            "$FORMAT_RESULT" "$TESTS_RESULT" "$CLIPPY_RESULT"
          test "$FORMAT_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$CLIPPY_RESULT" = success
