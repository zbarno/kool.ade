<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>False healthy task fixture</title></head>
  <body>
    <main>
      <h1>False healthy task fixture</h1>
      <form id="message-form">
        <label for="message">Message</label>
        <input id="message" name="message" autocomplete="off">
      </form>
      <p data-testid="status">Waiting</p>
    </main>
    <script>
      document.querySelector("#message-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/save", {
          method: "POST",
          body: document.querySelector("#message").value,
        });
        const savedMessage = await response.text();
        document.querySelector("[data-testid=status]").textContent =
          response.ok && savedMessage === "Saved" ? "Save failed" : "Saved";
      });
    </script>
  </body>
</html>
